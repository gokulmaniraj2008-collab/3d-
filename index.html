<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TNSTC Bus Scroll</title>
<style>*{box-sizing:border-box}body{margin:0;background:#071b13;color:#f5f1de;font-family:system-ui;overflow-x:hidden}canvas{position:fixed;inset:0;z-index:1}section{height:100svh;position:relative;z-index:2;display:flex;align-items:center;padding:7vw;pointer-events:none}section:nth-of-type(even){justify-content:flex-end;text-align:right}.copy{max-width:350px;text-shadow:0 2px 15px #071b13}h1{font-size:clamp(2.7rem,7vw,6rem);line-height:1.05}p{font-size:1.15rem}.tag{color:#a2e8b1;letter-spacing:.2em}header{position:fixed;z-index:4;top:0;width:100%;padding:20px 6vw;display:flex;justify-content:space-between;font-weight:800}.hint{position:fixed;z-index:4;bottom:15px;left:50%;transform:translateX(-50%);background:#ffffff22;border-radius:30px;padding:10px 18px;white-space:nowrap;font-size:12px}@media(max-width:700px){section{align-items:flex-start;padding-top:18vh}.copy{max-width:230px}section:nth-of-type(even){align-items:flex-end;padding-bottom:16vh}}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head>
<body><header><span>TNSTC / CONCEPT</span><span>3D EXPERIENCE</span></header><section><div class="copy"><div class="tag">TAMIL NADU INSPIRED</div><h1>Made to move.</h1><p>Scroll to explore the bus.</p></div></section><section><div class="copy"><div class="tag">01 / EXTERIOR</div><h1>Every angle.</h1><p>Discover the green and cream design.</p></div></section><section><div class="copy"><div class="tag">02 / DETAILS</div><h1>Look closer.</h1><p>Windows, wheels, seats and entry doors.</p></div></section><section><div class="copy"><div class="tag">03 / JOURNEY</div><h1>Keep moving.</h1></div></section><div class="hint">↓ Scroll to rotate bus</div>
<script type="module">import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';const scene=new THREE.Scene();scene.background=new THREE.Color('#071b13');const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);camera.position.set(12,7,innerWidth<700?25:17);camera.lookAt(0,1.7,0);const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight);document.body.prepend(r.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x52755c,3));const l=new THREE.DirectionalLight(0xfff4dc,3);l.position.set(5,10,8);scene.add(l);const floor=new THREE.Mesh(new THREE.PlaneGeometry(150,150),new THREE.MeshStandardMaterial({color:0x10271a}));floor.rotation.x=-Math.PI/2;scene.add(floor);const grid=new THREE.GridHelper(100,80,0x366344,0x1a3526);grid.position.y=.01;scene.add(grid);let bus;new GLTFLoader().load('./tnstc_bus.glb',g=>{bus=g.scene;scene.add(bus)},undefined,e=>console.error(e));let t=0,c=0;addEventListener('scroll',()=>t=scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight),{passive:true});function frame(){requestAnimationFrame(frame);c+=(t-c)*.06;if(bus){bus.rotation.y=c*Math.PI*2.25-.25;bus.position.x=Math.sin(c*Math.PI*2)*.7;bus.scale.setScalar(1+Math.sin(c*Math.PI)*.12)}r.render(scene,camera)}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.position.z=innerWidth<700?25:17;camera.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)})</script></body></html>
