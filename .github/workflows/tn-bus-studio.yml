name: Build TN Bus 3D
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'TN_BUS_STUDIO/**'
      - '.github/workflows/tn-bus-studio.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: sudo apt-get update && sudo apt-get install -y blender
      - name: Generate BLEND, GLB and preview
        run: blender -b -t 2 --python TN_BUS_STUDIO/Blender/generate_bus.py
      - name: Verify exports
        run: |
          test -s TN_BUS_STUDIO/Shared_Assets/TN_Bus.blend
          test -s TN_BUS_STUDIO/Shared_Assets/TN_Bus.glb
          test -s TN_BUS_STUDIO/Shared_Assets/TN_Bus_preview.png
      - name: Upload downloadable files
        uses: actions/upload-artifact@v4
        with:
          name: TN-Bus-3D
          path: TN_BUS_STUDIO/Shared_Assets/
          retention-days: 7
