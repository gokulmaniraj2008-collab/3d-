name: Build TN Bus 3D
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'TN_BUS_STUDIO/**'
      - '.github/workflows/tn-bus-*.yml'
  pull_request:
    paths:
      - 'TN_BUS_STUDIO/**'
      - '.github/workflows/tn-bus-studio.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: sudo apt-get update && sudo apt-get install -y blender python3-numpy
      - name: Validate model configuration
        run: python3 TN_BUS_STUDIO/Blender/validate_config.py
      - name: Generate BLEND, GLB and preview
        run: blender -b -t 2 --python-exit-code 1 --python TN_BUS_STUDIO/Blender/generate_bus.py
      - name: Verify export signatures and sizes
        run: python3 TN_BUS_STUDIO/Blender/validate_outputs.py
      - name: Upload downloadable files
        uses: actions/upload-artifact@v4
        with:
          name: TN-Bus-3D
          path: TN_BUS_STUDIO/Shared_Assets/
          retention-days: 7
      - name: Publish verified GLB for Vercel viewer (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ai-3d-studio/models
          cp TN_BUS_STUDIO/Shared_Assets/TN_Bus.glb ai-3d-studio/models/TN_Bus.glb
          test -s ai-3d-studio/models/TN_Bus.glb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-3d-studio/models/TN_Bus.glb
          if git diff --cached --quiet; then
            echo 'Viewer GLB unchanged'; exit 0
          fi
          git commit -m 'Publish validated TN Bus GLB for web viewer [skip ci]'
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:main
