name: Build playable TN Bus Web Simulator
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'TN_BUS_STUDIO/**'
      - '.github/workflows/tn-bus-web.yml'
  pull_request:
    paths:
      - 'TN_BUS_STUDIO/**'
      - '.github/workflows/tn-bus-web.yml'
permissions:
  contents: write
concurrency:
  group: tn-bus-web-${{ github.ref }}
  cancel-in-progress: false
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and NumPy
        run: sudo apt-get update && sudo apt-get install -y blender python3-numpy unzip
      - name: Generate shared bus
        run: |
          python3 TN_BUS_STUDIO/Blender/validate_config.py
          blender -b -t 2 --python-exit-code 1 --python TN_BUS_STUDIO/Blender/generate_bus.py
          python3 TN_BUS_STUDIO/Blender/validate_outputs.py
          python3 TN_BUS_STUDIO/Blender/validate_engine_assets.py
          cp TN_BUS_STUDIO/Shared_Assets/TN_Bus.glb TN_BUS_STUDIO/Godot/TN_Bus_Simulator/assets/TN_Bus.glb
      - name: Install Godot 4.3 and matching Web export templates
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
          mv /tmp/Godot_v4.3-stable_linux.x86_64 /tmp/godot
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
      - name: Import and smoke-test simulator
        run: |
          /tmp/godot --headless --path TN_BUS_STUDIO/Godot/TN_Bus_Simulator --editor --import --quit
          timeout 120s /tmp/godot --headless --path TN_BUS_STUDIO/Godot/TN_Bus_Simulator --script res://tests/smoke_test.gd
      - name: Export single-threaded HTML5 simulator
        run: |
          mkdir -p ai-3d-studio/simulator
          /tmp/godot --headless --path TN_BUS_STUDIO/Godot/TN_Bus_Simulator --export-release Web "$GITHUB_WORKSPACE/ai-3d-studio/simulator/index.html"
          test -s ai-3d-studio/simulator/index.html
          test -s ai-3d-studio/simulator/index.wasm
          test -s ai-3d-studio/simulator/index.pck
          test -s ai-3d-studio/simulator/index.js
      - name: Upload playable web build
        uses: actions/upload-artifact@v4
        with:
          name: TN-Bus-Web-Simulator
          path: ai-3d-studio/simulator/
          retention-days: 7
      - name: Publish validated web build to website (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-3d-studio/simulator/
          if git diff --cached --quiet; then echo 'Web build unchanged'; exit 0; fi
          git commit -m 'Publish validated Godot web simulator [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
