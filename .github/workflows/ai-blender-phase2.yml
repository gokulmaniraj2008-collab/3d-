name: AI Blender Phase 2
on:
  pull_request:
    paths:
      - 'ai-blender/**'
      - '.github/workflows/ai-blender-phase2.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Example works without API key; prompt uses repository secret
        type: choice
        required: true
        options:
          - example
          - prompt
      prompt:
        description: Natural language model request (3-500 characters)
        required: false
        type: string

permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && 'write' || 'read' }}
    concurrency:
      group: ai-blender-phase2-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender -b --python-expr 'import numpy; print(numpy.__version__)'
      - name: Validate scene schema
        run: python3 -m unittest discover -s ai-blender/phase2/tests -v
      - name: Prepare scene
        env:
          GEMINI_API_KEY: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && secrets.GEMINI_API_KEY || '' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_PROMPT: ${{ inputs.prompt }}
        run: |
          set -euo pipefail
          mkdir -p ai-blender-output/phase2
          if [[ "${{ github.event_name }}" == "pull_request" || "$INPUT_MODE" == "example" ]]; then
            cp ai-blender/phase2/examples/study-table.json ai-blender-output/phase2/scene.json
          elif [[ "$INPUT_MODE" == "prompt" ]]; then
            if [[ -z "$INPUT_PROMPT" || ${#INPUT_PROMPT} -gt 500 ]]; then
              echo "Prompt required (up to 500 characters)"; exit 1
            fi
            python3 ai-blender/phase2/plan.py --prompt "$INPUT_PROMPT" --output ai-blender-output/phase2/scene.json
          else
            echo "Unsupported mode"; exit 1
          fi
      - name: Compile and validate 3D outputs
        run: |
          blender -b -t 2 --python ai-blender/blender/compile_scene.py -- --scene ai-blender-output/phase2/scene.json --output ai-blender-output/phase2
          python3 ai-blender/tests/validate_glb.py ai-blender-output/phase2/scene.glb
          test -s ai-blender-output/phase2/scene.blend
          test -s ai-blender-output/phase2/scene.png
      - uses: actions/upload-artifact@v4
        with:
          name: ai-blender-phase2-${{ github.run_id }}
          path: ai-blender-output/phase2/
          if-no-files-found: error
          retention-days: 7
      - name: Publish latest model to isolated gallery branch
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        env:
          GH_RUN_ID: ${{ github.run_id }}
          GH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 ai-blender/phase4/make_manifest.py --source ai-blender-output/phase2 --output "$RUNNER_TEMP/gallery-payload" --run-id "$GH_RUN_ID" --sha "$GH_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin ai-blender-gallery; then
            git worktree add -B gallery-output "$RUNNER_TEMP/ai-blender-gallery" origin/ai-blender-gallery
          else
            git worktree add --detach "$RUNNER_TEMP/ai-blender-gallery" "$GITHUB_SHA"
            git -C "$RUNNER_TEMP/ai-blender-gallery" switch --orphan gallery-output
            git -C "$RUNNER_TEMP/ai-blender-gallery" rm -rf . || true
          fi
          cp "$RUNNER_TEMP/gallery-payload/scene.glb" "$RUNNER_TEMP/ai-blender-gallery/scene.glb"
          cp "$RUNNER_TEMP/gallery-payload/latest.json" "$RUNNER_TEMP/ai-blender-gallery/latest.json"
          git -C "$RUNNER_TEMP/ai-blender-gallery" add scene.glb latest.json
          if ! git -C "$RUNNER_TEMP/ai-blender-gallery" diff --cached --quiet; then
            git -C "$RUNNER_TEMP/ai-blender-gallery" commit -m "Publish AI Blender model from run $GH_RUN_ID"
            git -C "$RUNNER_TEMP/ai-blender-gallery" push origin HEAD:refs/heads/ai-blender-gallery
          fi
